workflows:
  flutter-android-workflow:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Inicializar projeto Flutter e gerar Android
        script: |
          if [ ! -d "android" ]; then
            flutter create . --org com.mapaterritorio.app --platforms android
          fi
      - name: Instalar dependências
        script: |
          flutter pub get
      - name: Construir APK (Release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  
