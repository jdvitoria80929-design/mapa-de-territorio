workflows:
  build-apk-final:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Limpar pasta android antiga se existir
        script: |
          rm -rf android
      - name: Criar estrutura Android moderna limpa
        script: |
          flutter create . --org com.mapaterritorio.app --platforms android
      - name: Instalar dependências
        script: |
          flutter pub get
      - name: Injetar propriedades do Gradle
        script: |
          echo "flutterVersionCode=1" >> android/local.properties
          echo "flutterVersionName=1.0.0" >> android/local.properties
      - name: Construir APK (Release)
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  
